<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Information Form</title>
</head>
<body>

    <h2>User Data</h2>

    <form action="#" method="POST">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name"><br><br>

        <label for="fatherName">Father:</label>
        <input type="text" id="fatherName" name="fatherName"><br><br>
        <label for="gender">Gender:</label>
            <select id="gender" name="gender">
                <option value="">Select...</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
            </select>

        <label for="dob">DoB:</label>
        <input type="date" id="dob" name="dob"><br><br>

        <br><br>

        <label>Hobbies:</label>
        <input type="checkbox" id="hobby1" name="hobbies" value="reading">
        <label for="hobby1">Reading</label>

        <input type="checkbox" id="hobby2" name="hobbies" value="coding">
        <label for="hobby2">Coding</label>

        <input type="checkbox" id="hobby3" name="hobbies" value="gaming">
        <label for="hobby3">Gaming</label><br><br>

        <label for="address">Address:</label>
        <input type="text" id="address" name="address"><br><br>

        <button type="submit">Submit</button>
    </form>

</body>
</html>
